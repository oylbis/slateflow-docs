site_name: SlateFlow Docs
site_description: User documentation for the SlateFlow suite of Blender add-ons
site_url: https://oylbis.github.io/slateflow-docs/
repo_url: https://github.com/oylbis/slateflow-docs

theme:
  name: material
  logo: assets/branding/logo_slateflow.png
  favicon: assets/branding/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: white
    accent: teal
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/page-fx.js
  - javascripts/addon-theme.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Documentation SlateFlow
          site_description: Documentation utilisateur de la suite d'addons Blender SlateFlow

nav:
  - index.md
  - dopesheetFlow:
      - dopesheetFlow/index.md
      - dopesheetFlow/installation.md
      - dopesheetFlow/features.md
      - dopesheetFlow/preferences.md
      - dopesheetFlow/changelog.md
  - storyFlow:
      - storyFlow/index.md
      - storyFlow/installation.md
      - storyFlow/features.md
      - storyFlow/shortcuts.md
      - storyFlow/changelog.md
  - sequencerOTIO:
      - sequencerOTIO/index.md
      - sequencerOTIO/installation.md
      - sequencerOTIO/features.md
      - sequencerOTIO/configuration.md
      - sequencerOTIO/changelog.md
  - gpFlow:
      - gpFlow/index.md
      - gpFlow/installation.md
      - gpFlow/features.md
      - gpFlow/preferences.md
      - gpFlow/changelog.md
  - gpOutliner:
      - gpOutliner/index.md
      - gpOutliner/installation.md
      - gpOutliner/features.md
      - gpOutliner/changelog.md
  - sequencerFlow:
      - sequencerFlow/index.md
      - sequencerFlow/installation.md
      - sequencerFlow/features.md
      - sequencerFlow/shortcuts.md
      - sequencerFlow/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oylbis
