site_name: SlateFlow Docs
site_description: User documentation for the SlateFlow suite of Blender add-ons
site_url: https://oylbis.github.io/slateflow-docs/
repo_url: https://github.com/oylbis/slateflow-docs

theme:
  name: material
  logo: assets/branding/logo_slateflow.png
  favicon: assets/branding/favicon.png
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Documentation SlateFlow
          site_description: Documentation utilisateur de la suite d'addons Blender SlateFlow

nav:
  - index.md
  - dopesheetFlow:
      - dopesheetFlow/index.md
      - dopesheetFlow/installation.md
      - dopesheetFlow/getting-started.md
      - dopesheetFlow/features.md
      - dopesheetFlow/preferences.md
      - dopesheetFlow/faq.md
      - dopesheetFlow/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oylbis
